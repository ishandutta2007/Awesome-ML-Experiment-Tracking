<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accent-pink" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes floatWave{0%{stroke-dashoffset:0}}@keyframes nodeGlow{0%{r:4px;opacity:.5}50%{r:7px;opacity:1}}.title{font-weight:800;font-size:52px;fill:url(#text-grad)}.subtitle,.tagline,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:500;font-size:22px;fill:#e2e8f0;letter-spacing:.5px}.tagline{font-weight:400;font-size:16px;fill:#94a3b8}.bg-circle-1{animation:pulse 8s ease-in-out infinite;transform-origin:200px 100px}.bg-circle-2{animation:pulse 10s ease-in-out infinite 2s;transform-origin:1000px 300px}.wave-line{stroke-dasharray:20 10;animation:floatWave 30s linear infinite}.animated-node{animation:nodeGlow 3s ease-in-out infinite}</style><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><g opacity=".4"><path stroke="#334155" stroke-width="1" d="M 0,100 L 1200,100 M 0,