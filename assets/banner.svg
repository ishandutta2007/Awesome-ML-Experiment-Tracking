<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    
    /* Subtle Dynamic Animations */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes floatWave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }
    @keyframes nodeGlow {
      0%, 100% { r: 4px; opacity: 0.5; }
      50% { r: 7px; opacity: 1; }
    }

    .bg-circle-1 {
      animation: pulse 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .bg-circle-2 {
      animation: pulse 10s ease-in-out infinite 2s;
      transform-origin: 1000px 300px;
    }
    .wave-line {
      stroke-dasharray: 20 10;
      animation: floatWave 30s linear infinite;
    }
    .animated-node {
      animation: nodeGlow 3s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Animated Background Visual Elements (strictly behind text) -->
  <g opacity="0.4">
    <!-- Grid Pattern -->
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400 M 800,0 L 800,400 M 1000,0 L 1000,400" stroke="#334155" stroke-width="1" opacity="0.3" />

    <!-- Ambient Glowing Orbs -->
    <circle class="bg-circle-1" cx="150" cy="80" r="180" fill="#0284c7" opacity="0.25" filter="url(#glow)"/>
    <circle class="bg-circle-2" cx="1050" cy="320" r="220" fill="#9333ea" opacity="0.2" filter="url(#glow)"/>

    <!-- Dynamic Experiment Wave / Chart Lines in Background -->
    <path class="wave-line" d="M -50 320 Q 150 260 350 330 T 750 250 T 1150 290 T 1300 240" fill="none" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.6"/>
    <path class="wave-line" d="M -50 350 Q 200 280 450 350 T 850 230 T 1250 270" fill="none" stroke="url(#accent-pink)" stroke-width="2" opacity="0.5"/>

    <!-- Data Nodes -->
    <circle class="animated-node" cx="350" cy="330" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle class="animated-node" cx="750" cy="250" r="5" fill="#818cf8" filter="url(#glow)" style="animation-delay: 1s;"/>
    <circle class="animated-node" cx="850" cy="230" r="5" fill="#ec4899" filter="url(#glow)" style="animation-delay: 1.5s;"/>
  </g>

  <!-- Foreground Content Block (High contrast, clearly visible) -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <rect x="0" y="85" width="230" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <text x="115" y="107" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">⚡ MLOPS ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="180" class="title" filter="url(#glow)">Awesome ML Experiment Tracking 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="225" class="subtitle">Curated Top SaaS Platforms &amp; Open-Source Projects</text>

    <!-- Tagline / Features -->
    <text x="0" y="270" class="tagline">📊 Metric Logging  •  🎛️ Hyperparameter Sweeps  •  📦 Model Registry  •  🔄 Reproducibility</text>
  </g>
</svg>
